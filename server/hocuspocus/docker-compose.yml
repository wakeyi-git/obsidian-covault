services:
  hocuspocus:
    build: .
    container_name: covault-realtime
    restart: unless-stopped
    ports:
      - "1234:1234"        # NAS 내부 포트(외부 직접 노출 금지 — 리버스 프록시로만)
    # 비밀·인스턴스별 값(YJS_SECRET·COUCHDB_*)은 .env에 둔다 — .env.example을 복사해 채우세요.
    # (compose 파일에 평문 시크릿을 남기지 않는다. .env는 .gitignore로 커밋 제외.)
    env_file:
      - .env
    environment:
      # 비밀이 아닌 고정 설정만 인라인(필요 시 .env에서 덮어쓸 수 있다).
      - HOST=0.0.0.0
      - PORT=1234
      - SQLITE_PATH=/data/hocuspocus.sqlite   # Yjs 문서 상태 영속화(서버 재시작 복원)
    volumes:
      - ./data:/data
    # 헬스체크: /health(onRequest)가 200을 주면 정상. slim 이미지엔 curl/wget이 없어 node로 확인한다.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:1234/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 로그 회전: NAS에서 컨테이너 로그가 무한 증가하는 것을 막는다(10MB×3개).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
