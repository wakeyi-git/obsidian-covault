name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Check i18n (duplicate keys fail, missing keys warn)
        run: npm run i18n:check

      - name: Build
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --prerelease \
            --notes="CoVault $TAG (beta). BRAT으로 설치해 테스트하세요. 자세한 내용은 README 참고." \
            main.js manifest.json styles.css
